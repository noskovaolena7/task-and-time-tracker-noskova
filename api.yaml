          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /users/{userId}/notifications:
    get:
      summary: Get notifications for user
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/userId"
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: size
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        401:
