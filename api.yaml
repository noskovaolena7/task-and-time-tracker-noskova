openapi: 3.1.0
info:
  title: Project & Task Management API
  description: API for managing companies, users, roles, projects, members, tasks, comments, history, attachments, deadlines, reminders, notifications, and time tracking.
  version: 1.0.0

servers:
  - url: "http://localhost:8080"


security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Companies
    description: Company management
  - name: Users
    description: User management
  - name: Company Roles
    description: User roles inside companies
  - name: Projects
    description: Project CRUD operations
  - name: Project Members
    description: Members inside projects
  - name: Tasks
    description: Task CRUD operations
  - name: Time Entries
    description: Time tracking for tasks
  - name: Comments
    description: Comments on tasks
  - name: Task History
    description: History of task changes
  - name: Notifications
    description: User notifications
  - name: Attachments
    description: File attachments for tasks
  - name: Project Deadlines
    description: Deadlines for projects
  - name: Task Reminders
    description: Reminders for tasks
  - name: Invites
    description: Company invites

paths:

  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/signup/personal:
    post:
      summary: Register personal user (personal workspace)
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalSignUpRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/signup/company:
    post:
      summary: Register company user (company workspace)
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySignUpRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /companies:
    get:
      summary: Get all companies
      tags: [Companies]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create company
      tags: [Companies]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{companyId}:
    get:
      summary: Get company by ID
      tags: [Companies]
      parameters:
        - $ref: "#/components/parameters/companyId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

    put:
      summary: Update company
      tags: [Companies]
      parameters:
        - $ref: "#/components/parameters/companyId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateRequest"
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete company
      tags: [Companies]
      parameters:
        - $ref: "#/components/parameters/companyId"
      responses:
        204:
          description: Deleted


  /companies/{companyId}/roles:
    get:
      summary: Get roles for company
      tags: [Company Roles]
      parameters:
        - $ref: "#/components/parameters/companyId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCompanyRole"

    post:
      summary: Assign role to user in company
      tags: [Company Roles]
      parameters:
        - $ref: "#/components/parameters/companyId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCompanyRoleCreateRequest"
      responses:
        201:
          description: Created

  /companies/{companyId}/roles/{roleId}:
    put:
      summary: Change user role in company (promotion/demotion)
      description: OWNER may grant USER, MANAGER, ADMIN and OWNER (co-owners with equal rights). ADMIN may grant USER and MANAGER only.
      tags: [Company Roles]
      parameters:
        - $ref: "#/components/parameters/companyId"
        - in: path
          name: roleId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCompanyRoleCreateRequest"
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCompanyRole"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /companies/{companyId}/roles/{roleId}:
    delete:
      summary: Remove role (leave company or remove a member)
      description: A user may always remove their own row (leave). OWNER may remove anyone except the recorded owner. ADMIN may remove USER and MANAGER rows.
      tags: [Company Roles]
      parameters:
        - $ref: "#/components/parameters/companyId"
        - in: path
          name: roleId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Deleted
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspaces:
    get:
      summary: Get my workspaces
      description: Personal workspace plus company workspaces of all memberships. Personal workspace stays until the owner deletes it.
      tags: [Users]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspaces/{workspaceId}:
    delete:
      summary: Delete workspace (owner only)
      tags: [Users]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Deleted
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /users:
    get:
      summary: Get all users
      tags: [Users]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}:
    get:
      summary: Get user by ID
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    put:
      summary: Update user
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        400:
          description: Bad Request
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"

    delete:
      summary: Delete own account
      description: Only the account owner may delete it. Personal projects, tasks and workspaces are deleted with the account; company projects created by the user remain (author becomes empty). Company owners must transfer ownership first (400 otherwise). Removing someone else from a company is done via company roles, not here.
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        204:
          description: Deleted
        400:
          description: Bad Request (e.g. ownership not transferred)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /projects:
    get:
      summary: Get all projects
      tags: [Projects]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: size
          schema:
            type: integer
        - in: query
          name: company_id
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create new project
      tags: [Projects]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}:
    get:
      summary: Get project by ID
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        204:
          description: Deleted


  /projects/{projectId}/members:
    get:
      summary: Get project members
      tags: [Project Members]
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Add member to project
      tags: [Project Members]
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /projects/{projectId}/members/{userId}:
    delete:
      summary: Remove member from project
      tags: [Project Members]
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/userId"
      responses:
        204:
          description: Deleted
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /tasks:
    get:
      summary: Get all tasks
      tags: [Tasks]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: project_id
          schema:
            type: string
            format: uuid
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create new task
      tags: [Tasks]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tasks/{taskId}:
    get:
      summary: Get task by ID
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update task
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


    delete:
      summary: Delete task
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        204:
          description: Deleted


  /tasks/{taskId}/time-entries:
    get:
      summary: Get time entries for task
      tags: [Time Entries]
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create time entry
      tags: [Time Entries]
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /tasks/{taskId}/comments:
    get:
      summary: Get comments for task
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Add comment
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /tasks/{taskId}/comments/{commentId}:
    delete:
      summary: Delete comment (author or task manager)
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/taskId"
        - in: path
          name: commentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Deleted
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /tasks/{taskId}/history:
    get:
      summary: Get task history
      tags: [Task History]
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskHistory"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /users/{userId}/notifications:
    get:
      summary: Get notifications for user
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/userId"
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: size
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/upcoming:
    get:
      summary: Upcoming deadlines and reminders
      description: Aggregated across own personal projects and all own companies (overdue + next N days, sorted). Powers the dashboard widget.
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/userId"
        - in: query
          name: days
          schema:
            type: integer
            default: 7
        - in: query
          name: size
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: OK
          content:
            application/json:
