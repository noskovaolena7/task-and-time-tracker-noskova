          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Upload attachment
      tags: [Attachments]
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /projects/{projectId}/deadlines:
    get:
      summary: Get deadlines for project
      tags: [Project Deadlines]
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        200:
          description: OK
