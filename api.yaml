components:

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    companyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

  schemas:

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          required: true
          example: "codillas@gmail.com"
        password:
          type: string
          format: password
          writeOnly: true
          required: true
          example: 'Best_secure_password'

    PersonalSignUpRequest:
      type: object
      required: [ first_name, last_name, email, password, phone_number ]
      properties:
        first_name:
          type: string
          required: true
          example: Vasya
        last_name:
          type: string
          required: true
          example: Pupkin
        email:
          type: string
          format: email
          required: true
          example: "codillas@gmail.com"
        password:
          type: string
          format: password
          writeOnly: true
          required: true
          example: 'Best_secure_password'
        phone_number:
          type: string
          required: true
          example: +417612312312

    CompanySignUpRequest:
      type: object
      required: [ first_name, last_name, email, password, phone_number, company_name ]
      properties:
        first_name:
          type: string
          required: true
          example: Vasya
        last_name:
          type: string
          required: true
          example: Pupkin
        email:
          type: string
          format: email
          required: true
          example: "codillas@gmail.com"
        password:
          type: string
          format: password
          writeOnly: true
          required: true
          example: 'Best_secure_password'
        phone_number:
          type: string
          required: true
          example: +417612312312
        company_name:
          type: string
          required: true
          example: Acme Inc
        company_description:
          type: string
          example: Task tracking for Acme

    TokenResponse:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
          format: text
          description: JWT
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiJ9.abc123

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          required: true
          example: Vasya
        last_name:
          type: string
          required: true
          example: Pupkin
        email:
          type: string
          format: email
          required: true
          example: "codillas@gmail.com"
        phone_number:
          type: string
          required: true
          example: +417612312312
        member_role:
          type: string
          enum: [ USER, MANAGER, ADMIN, OWNER ]

    UserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompanyCreateRequest:
      type: object
      required: [ owner_id, name ]
      properties:
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    CompanyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    UserCompanyRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ USER, MANAGER, ADMIN, OWNER ]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCompanyRoleCreateRequest:
      type: object
      required: [ user_id, role ]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ USER, MANAGER, ADMIN, OWNER, PERSONAL_USER, COMPANY_USER ]
          description: PERSONAL_USER and COMPANY_USER are accepted and map to USER.

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectCreateRequest:
      type: object
      required: [ name, created_by ]
      properties:
        company_id:
          type: string
          format: uuid
          description: Omit for a personal project (no company).
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid

    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    ProjectMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        member_role:
          type: string
          enum: [ USER, MANAGER, ADMIN, OWNER ]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectMemberCreateRequest:
      type: object
      required: [ user_id, member_role ]
      properties:
        user_id:
          type: string
          format: uuid
        member_role:
          type: string
          enum: [ USER, MANAGER, ADMIN, OWNER ]

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ OPEN, IN_PROGRESS, DONE, CANCELED]
        priority:
          type: string
          enum: [ LOW, MEDIUM, HIGH, CRITICAL ]
        created_by:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      required: [ project_id, title, status, priority, created_by ]
      properties:
        project_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        created_by:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time

    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        assigned_to:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    TimeEntryCreateRequest:
      type: object
      required: [ user_id, start_time, end_time ]
      properties:
        user_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    TimeEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommentCreateRequest:
      type: object
      required: [ user_id, text ]
      properties:
        user_id:
          type: string
          format: uuid
        text:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        text:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskHistory:
      type: object
      required: [ id, task_id, user_id, field_changed, changed_at ]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        field_changed:
          type: string
        old_value:
          type: string
        new_value:
          type: string
        changed_at:
          type: string
          format: date-time

    Upcoming:
      type: object
      properties:
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingDeadline"
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingReminder"

    UpcomingDeadline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        title:
          type: string
        deadline:
          type: string
          format: date-time
        overdue:
          type: boolean

    UpcomingReminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        task_title:
          type: string
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        remind_at:
          type: string
          format: date-time
        message:
          type: string
        overdue:
          type: boolean

    Notification:
      type: object
      required: [ id, user_id, type, message, is_read, created_at ]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
          enum: [ SENT, DELIVERED, READ, FAILED ]
        message:
          type: string
        is_read:
          type: boolean
        scheduled_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AttachmentCreateRequest:
      type: object
      required: [ file_name, file_url, uploaded_by ]
      properties:
        file_name:
          type: string
        file_url:
          type: string
        uploaded_by:
          type: string
          format: uuid
          description: Ignored on create/update — the uploader is taken from the auth token.

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_url:
          type: string
        uploaded_by:
          type: string
          format: uuid
        uploaded_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectDeadline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        deadline:
          type: string
          format: date-time
        reminder_periods:
          type: array
          items:
            type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectDeadlineCreateRequest:
      type: object
      required: [ deadline, reminder_periods, created_by ]
      properties:
        deadline:
          type: string
          format: date-time
        reminder_periods:
          type: array
          items:
            type: string
        created_by:
          type: string
          format: uuid

    ProjectDeadlineUpdateRequest:
      type: object
      required: [ deadline, title ]
      properties:
        deadline:
          type: string
          format: date-time
        title:
          type: string

    TaskReminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        remind_at:
          type: string
          format: date-time
        message:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskReminderCreateRequest:
      type: object
      required: [ remind_at, message, created_by ]
      properties:
        remind_at:
          type: string
          format: date-time
        message:
          type: string
        created_by:
          type: string
          format: uuid

    Workspace:
      type: object
